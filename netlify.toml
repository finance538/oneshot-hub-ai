[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium", "playwright-core", "microsoft-cognitiveservices-speech-sdk", "imapflow", "nodemailer", "mailparser"]

[functions.api]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api?route=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Clear-Site-Data = '"cache"'
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=()"
