    <script>
      if ("serviceWorker" in navigator)
        navigator.serviceWorker
          .getRegistrations()
          .then(function (items) {
            items.forEach(function (item) {
              item.unregister();
            });
          })
          .catch(function () {});
      if ("caches" in window)
        caches
          .keys()
          .then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key);
            });
          })
          .catch(function () {});
    </script>
