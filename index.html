<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script id="oneshot-lang">
      // Runs before the app: restore the saved language so a refresh never
      // flips direction or language. Arabic RTL is the default.
      (function () {
        var supported = ["ar", "en", "fr", "es", "tr", "zh", "hi", "ur"];
        var lang = "ar";
        try {
          var q = new URLSearchParams(location.search).get("lang");
          var c = document.cookie.match(/(?:^|; )oneshot_lang=([a-z]{2})/);
          var saved = localStorage.getItem("oneshot.lang");
          lang = [q, saved, c && c[1]].filter(function (v) {
            return supported.indexOf(v) >= 0;
          })[0] || "ar";
        } catch (e) {}
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" || lang === "ur" ? "rtl" : "ltr";
      })();
    </script>
