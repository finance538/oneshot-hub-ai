<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b0c0e" />
    <title>OneShot · Offline</title>
    <style>
      body {
        margin: 0;
        background: #0b0c0e;
        color: #eee6db;
        font: 16px/1.8 sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 450px;
        padding: 30px;
      }
      h1 {
        font-size: 28px;
        color: #f97316;
      }
      p {
        color: #aaa;
      }
      a {
        display: inline-block;
        color: #eee;
        border: 1px solid #51402d;
        padding: 8px 20px;
        text-decoration: none;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>oneShot Hub</h1>
      <p>
        أنت غير متصل حالياً. تحتاج المحادثات والمهام وتسجيل الدخول إلى اتصال
        بالإنترنت.
      </p>
      <p lang="en" dir="ltr">
        You’re offline. Connect to use chat, tasks and sign-in. Private
        workspace data is never cached offline.
      </p>
      <a href="/hub">إعادة الاتصال · Reconnect</a>
    </main>
  </body>
</html>
